name: On release

# Dispatched by cut-release.yaml on the new tag. Builds the binaries for the
# GitHub release, publishes and signs the image, and then stages the chart
# (charts v2): rancher/charts indexes it on its staging branch, which is where
# Rancher reads its system charts from. There is no rancher/charts pull request
# to open any more.
#
# The chart is staged only after the image is published, because the
# ship-staged action refuses a chart whose images are not in the registry yet.

on:
  workflow_dispatch:

permissions: {}

# Two runs of the same tag must not stage the chart at the same time: the check
# that the version is not in the registry yet and the push are two calls (see
# "Call the action" in rancher/cargueiro docs/CHART_OWNER.md). The second run
# waits.
concurrency:
  group: stage-rancher-webhook-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  REPO: rancher

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure ref is a tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::This workflow must be dispatched on a tag ref (got ${GITHUB_REF_TYPE} '${GITHUB_REF}')"
            exit 1
          fi

  build:
    needs: guard
    name: build and package
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/go1.27:1.27.4
      # `make build` drives docker buildx on the runner's Docker daemon.
      options: --volume /var/run/docker.sock:/var/run/docker.sock
    strategy:
      matrix:
        arch:
        - amd64
        - arm64
    steps:

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Git safe directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Build Binary
      env:
        GIT_TAG: ${{ github.ref_name }}
      run: make build ARCH=${{ matrix.arch }}

    - name: Prepare Artifacts
      run: |
        mkdir -p dist/artifacts
        cp bin/webhook dist/artifacts/webhook-linux-${{ matrix.arch }}
        cd dist/artifacts
        sha256sum webhook-linux-${{ matrix.arch }} > sha256sum-${{ matrix.arch }}.txt

    - name: Upload artifacts
      # https://github.com/actions/upload-artifact/commit/65462800fd760344b1a7b4382951275a0abb4808
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: webhook-artifacts-${{ matrix.arch }}
        path: |
          dist/artifacts/webhook-linux-${{ matrix.arch }}
          dist/artifacts/sha256sum-${{ matrix.arch }}.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/go1.27:1.27.4
    permissions:
      contents: write
    steps:

    - name: Checkout repository
       # https://github.com/actions/checkout/releases/tag/v4.1.1
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Git safe directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Download the amd64 artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      # https://github.com/actions/download-artifact/releases/tag/v4.1.7
      with:
        name: webhook-artifacts-amd64
        path: dist/artifacts

    - name: Download the arm64 artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      # https://github.com/actions/download-artifact/releases/tag/v4.1.7
      with:
        name: webhook-artifacts-arm64
        path: dist/artifacts

    - name: Upload the files
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ github.ref_name }}
      run: |
        ls -lR dist
        cd dist/artifacts
        flags="--verify-tag --generate-notes"
        [[ "$VERSION" == *-rc* ]] && flags="$flags --prerelease"
        gh --repo "$GITHUB_REPOSITORY" release create "$VERSION" $flags webhook-linux-* sha256sum-*.txt

  publish:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for cosign signing
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Read vault secrets"
        uses: rancher-eio/read-vault-secrets@dfae8acd43a9e170fca5f90168da22f814fe4e9a
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials username | DOCKER_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials password | DOCKER_PASSWORD ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials registry | PRIME_STG_REGISTRY ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials username | PRIME_STG_REGISTRY_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials password | PRIME_STG_REGISTRY_PASSWORD

      - name: Publish image
        uses: rancher/ecm-distro-tools/actions/publish-image@c4025043b1e2af0a5a522f74b456b20f04e3d61e # v0.78.5
        with:
          image: rancher-webhook
          tag: ${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64

          public-registry: docker.io
          public-repo: rancher
          public-username: ${{ env.DOCKER_USERNAME }}
          public-password: ${{ env.DOCKER_PASSWORD }}

          push-to-prime: true
          prime-repo: rancher
          prime-make-target: push-prime-image
          identity-registry: ${{ vars.PRIME_REGISTRY_HOSTNAME }}
          prime-registry: ${{ env.PRIME_STG_REGISTRY }}
          prime-username: ${{ env.PRIME_STG_REGISTRY_USERNAME }}
          prime-password: ${{ env.PRIME_STG_REGISTRY_PASSWORD }}

  stage-chart:
    # After publish: cargueiro checks that every image of the chart is pushed.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for vault
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the chart
        id: prepare
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(./.github/workflows/scripts/prepare-chart.sh "$TAG" "$RUNNER_TEMP/chart")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Stamps, checks, packages and pushes the chart to the staging catalog
      # registry, then starts the chart-staged workflow of rancher/charts, which
      # adds it to the index.yaml of the staging branch.
      - name: Stage the chart and notify rancher/charts
        # Please keep this action on the chart-owners branch and do not pin it to a commit.
        # The branch carries the checks that stop a faulty release, for example that the
        # images of the chart are pushed before the chart. A commit keeps only the checks
        # that existed when it was copied.
        uses: rancher/charts/.github/actions/ship-staged@chart-owners # zizmor: ignore[unpinned-uses] rancher/charts is an internal trusted repository and its chart-owners branch carries the release checks
        with:
          chart-dir: ${{ runner.temp }}/chart/rancher-webhook
          version: ${{ steps.prepare.outputs.version }}
