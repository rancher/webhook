name: Stage chart

# Charts v2: stage the rancher-webhook chart as an OCI artifact in the staging
# catalog registry with cargueiro. Releasing it is handled on the rancher/charts
# side. Runs next to the GitHub release asset made by release.yaml, so both
# release paths work at the same time; drop the chart steps of release.yaml
# once the old path is gone.
#
# The ship-staged action of rancher/charts stamps, checks, packages and pushes
# the chart, and then starts the chart-staged.yaml workflow of rancher/charts,
# which ships the chart and opens a pull request that adds it to the index.yaml
# of the staging branch. It needs the chart-staged token of this repository in
# Vault (chart-staged/credentials).
#
# The action is pinned to a commit of the chart-owners branch of rancher/charts,
# which holds only the shared actions, so it moves only when they change.

on:
  workflow_dispatch:

permissions: {}

jobs:
  stage-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for vault
    steps:
      - name: Ensure ref is a tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::This workflow must be dispatched on a tag ref (got ${GITHUB_REF_TYPE} '${GITHUB_REF}')"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the chart
        id: prepare
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(./.github/workflows/scripts/prepare-chart.sh "$TAG" "$RUNNER_TEMP/chart")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Stage the chart and notify rancher/charts
        uses: rancher/charts/.github/actions/ship-staged@dcb7e8d0d9d0ce76847f751b7f224db5b192ae0d # chart-owners
        with:
          chart-dir: ${{ runner.temp }}/chart/rancher-webhook
          version: ${{ steps.prepare.outputs.version }}
