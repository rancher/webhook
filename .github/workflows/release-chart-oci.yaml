name: Release chart (OCI)

# Charts v2: publish the rancher-webhook chart as an OCI artifact to the
# staging catalog registry with cargueiro. Runs next to the GitHub release
# asset made by release.yaml, so both release paths work at the same time;
# drop the chart steps of release.yaml once the old path is gone.
#
# Once pushed, a `chart-released` repository_dispatch is sent to
# rancher/charts, whose add-chart-release.yaml workflow adds the version to
# the staging index.yaml.

on:
  workflow_dispatch:

permissions: {}

env:
  CARGUEIRO_VERSION: v0.0.4
  CARGUEIRO_SHA256: ad44907f903754ebef801ccc542b1a472708701a648c36d75c0341d40d2b386b
  CHART_REPO: rancher/catalog
  CHARTS_REPO: rancher/charts

jobs:
  release-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for vault
    outputs:
      version: ${{ steps.push.outputs.version }}
    steps:
      - name: Ensure ref is a tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::This workflow must be dispatched on a tag ref (got ${GITHUB_REF_TYPE} '${GITHUB_REF}')"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargueiro
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/cargueiro" \
            "https://github.com/nicholasSUSE/cargueiro/releases/download/${CARGUEIRO_VERSION}/cargueiro_linux_amd64"
          echo "${CARGUEIRO_SHA256}  $RUNNER_TEMP/bin/cargueiro" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/cargueiro"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Stamp, check and package the chart
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          archive=$(./.github/workflows/scripts/stamp-chart.sh "$TAG" dist/oci)
          cargueiro check archive "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Read vault secrets
        uses: rancher-eio/read-vault-secrets@dfae8acd43a9e170fca5f90168da22f814fe4e9a
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials registry | PRIME_STG_REGISTRY ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials username | CARGUEIRO_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials password | CARGUEIRO_PASSWORD

      - name: Check the registry is the staging one
        run: |
          if [ "$PRIME_STG_REGISTRY" != "stgregistry.suse.com" ]; then
            echo "::error::PRIME_STG_REGISTRY is not stgregistry.suse.com, so the push protections would not apply"
            exit 1
          fi

      - name: Push the chart
        id: push
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          ref=$(cargueiro push "$ARCHIVE" --registry "${PRIME_STG_REGISTRY}/${CHART_REPO}")
          echo "Pushed $ref" >> "$GITHUB_STEP_SUMMARY"
          version=$(tar -xzOf "$ARCHIVE" rancher-webhook/Chart.yaml | yq -r .version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Separate job so that a failed notification can be re-run on its own: the
  # push can't be re-run, as cargueiro never overwrites a tag in the staging
  # registry.
  notify-charts:
    needs: release-chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for vault
    steps:
      - name: Read vault secrets
        uses: rancher-eio/read-vault-secrets@dfae8acd43a9e170fca5f90168da22f814fe4e9a
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/github/app-credentials appId | APP_ID ;
            secret/data/github/repo/${{ github.repository }}/github/app-credentials privateKey | PRIVATE_KEY

      # Token scoped to rancher/charts only, to send the repository_dispatch.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}
          repositories: |
            charts

      - name: Notify rancher/charts of the new chart release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.release-chart.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "::error::No chart version from the release-chart job"
            exit 1
          fi
          gh api "repos/${CHARTS_REPO}/dispatches" \
            -f event_type=chart-released \
            -f "client_payload[chart]=rancher-webhook" \
            -f "client_payload[version]=${VERSION}" \
            -f "client_payload[source_repo]=${GITHUB_REPOSITORY}" \
            -f "client_payload[source_tag]=${TAG}"
